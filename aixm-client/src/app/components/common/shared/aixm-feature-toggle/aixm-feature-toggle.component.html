    <mat-slide-toggle class="aixm-feature-toggle" color="{{color}}" matTooltip="{{feature?.name}}"
                      [checked]="!featureService.isFeatureHidden($safeNavigationMigration(feature?.id))"
                      (change)="toggleChange($event)">
        <div style="display: flex; align-items: center">
            <span>{{feature?.abbreviation}}</span>
            <img class="aixm-icon" alt="{{ feature?.abbreviation }}" width="24" [src]="(feature?.icon ? $safeNavigationMigration(feature?.icon) :
                'assets/images/icons/AIXM/'+ $safeNavigationMigration(feature?.abbreviation)+'/'+$safeNavigationMigration(feature?.abbreviation)+'.svg')"
                 (error)="handleErrorMissingFeatureImage($event)">
        </div>
    </mat-slide-toggle>
